name: Yuanbao (元保)
description: >-
  Yuanbao Inc. (元保) is a technology-driven online insurance distribution
  platform in China, founded in 2019 and listed on NASDAQ under the ticker YB.
  It distributes medical, critical illness, accident, property, and pet
  insurance products directly to consumers and provides system services to
  partnered insurance carriers, embedding proprietary large language models into
  core functions including risk identification, customer acquisition, product
  design, personalized recommendation, policy management, and claims processing.
  Surfaced as a portfolio company of Qiming Venture Partners, Yuanbao operates a
  consumer-facing web and mobile experience (yuanbaobaoxian.com, redirecting to
  yuanbaobaoxian.cn) and does not publish a public developer portal, OpenAPI
  definition, SDKs, or open API platform at this time.
